[package]
name = "iris-brain"
description = "The trained network of Iris: tokenizer, ONNX inference with ONNX Runtime (loaded at run time), decoding."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iris-core.workspace = true
# Bindings to the ONNX Runtime the app already ships (1.28): loaded at run time, no download, no linking.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-28"] }
unicode-normalization = "0.1"

[dev-dependencies]
libc = "0.2"
