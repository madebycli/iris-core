# A device setting is only handled when its whole argument is understood; anything else is left to other skills.

[[pattern]]
intent = "volume"
re = '^(?:(?:setz\w*|stell\w*|mach\w*|dreh\w*|änder\w*) )?(?:die |meine )?(?:(?P<ring>klingellautstärke|klingeltonlautstärke|ruftonlautstärke)|medienlautstärke|musiklautstärke|lautstärke)(?: (?:auf|zu))? (?P<level>.+?)(?: (?:stellen|setzen|machen|drehen))?$'

[[pattern]]
intent = "volume"
re = '^(?:(?:mach\w*|dreh\w*|stell\w*) )?(?:es |das |die musik |den ton |das handy |den sound )?(?:(?:etwas|ein bisschen|bisschen|ein wenig|noch) )?(?P<dir>lauter|leiser)(?: (?:machen|drehen|stellen))?$'

[[pattern]]
intent = "brightness"
re = '^(?:(?:setz\w*|stell\w*|mach\w*|dreh\w*|änder\w*) )?(?:die )?(?:bildschirmhelligkeit|displayhelligkeit|helligkeit)(?: (?:auf|zu))? (?P<level>.+?)(?: (?:stellen|setzen|machen|drehen))?$'

[[pattern]]
intent = "brightness"
re = '^(?:(?:mach\w*|dreh\w*|stell\w*) )?(?:es |den bildschirm |das display |den screen )?(?:(?:etwas|ein bisschen|bisschen|ein wenig|noch) )?(?P<dir>heller|dunkler)(?: (?:machen|drehen|stellen))?$'

[[pattern]]
intent = "dnd"
re = '^(?:(?:aktivier\w*|schalt\w*|mach\w*|stell\w*) )?(?:den |das )?(?:bitte )?nicht stören(?: modus)?(?: (?P<off>aus|ab|deaktivieren|ausschalten|beenden|abschalten)| (?:an|ein|aktivieren|einschalten|anschalten))?$'

[[pattern]]
intent = "dnd"
re = '^(?P<off>deaktivier\w*|beend\w*) (?:den |das )?nicht stören(?: modus)?$'

[[pattern]]
intent = "sound_mode"
re = '^(?:(?:stell\w*|schalt\w*|mach\w*|setz\w*) )?(?:das handy |das telefon |mein handy |mein telefon |handy |telefon |den ton )?(?:auf )?(?P<mode>lautlos|stumm|vibration|vibrieren|vibrationsmodus|klingeln|laut|klingelton)(?: (?:an|ein|schalten|stellen|einschalten|machen))?$'

[[pattern]]
intent = "playing"
re = '^(?:was (?:läuft|spielt)(?: (?:da|gerade|grad|jetzt|im moment))*|welche[rsn]? (?:lied|song|titel|musik) (?:läuft|ist das|spielt)(?: (?:da|gerade|grad|jetzt))*|wie heißt (?:das lied|der song|dieser song|dieses lied)(?: (?:da|gerade|grad))*)$'

[[pattern]]
intent = "notifications"
re = '^(?:(?:lies|les\w*|zeig\w*) )?(?:mir )?(?:meine |die |neue |alle )?(?:benachrichtigungen|nachrichten|mitteilungen)(?: (?:von|aus|bei) (?P<app>.+?))?(?: (?:vor|an|vorlesen|zeigen|anzeigen))?$'

[[pattern]]
intent = "reply"
re = '^(?:antworte|antwort|schreib\w*) (?:auf |bei |an |zurück an )?(?P<app>.+?) (?:mit|zurück) (?P<message>.+)$'

[[pattern]]
# writing a new message is not something Iris can do; answering a notification is
intent = "send_message"
re = '^(?:schreib\w*|schick\w*|send\w*) (?P<to>.+?) (?:eine |ne |n )?(?:nachricht|sms|whatsapp|mail|e mail|email)\b|^(?:schreib\w*|schick\w*|send\w*) (?:eine |ne )?(?:nachricht|sms|whatsapp|mail|email) (?:an|für) (?P<to2>.+)$'

[[pattern]]
intent = "web_search"
re = '^(?:such\w*|google\w*|schau\w*) (?:im (?:web|internet|netz|browser)|online|bei duckduckgo) nach (?P<query>.+)$'

[expressions]
message = '(?i)^.*?\b(?:mit|zurück)\s+(?P<m>.+)$'
query = '(?i)^.*?\bnach\s+(?P<m>.+)$'

[words]
up = ["lauter", "heller", "hoch", "höher", "rauf", "nach oben", "mehr"]
down = ["leiser", "dunkler", "runter", "niedriger", "nach unten", "weniger"]
max = ["maximal", "maximum", "max", "ganz laut", "ganz hell", "voll", "ganz hoch", "auf voll"]
min = ["minimal", "minimum", "min", "null", "stumm", "aus", "ganz leise", "ganz dunkel"]
auto = ["automatisch", "auto", "adaptiv"]
percent = ["prozent"]
silent = ["lautlos", "stumm"]
vibrate = ["vibration", "vibrieren", "vibrationsmodus"]

