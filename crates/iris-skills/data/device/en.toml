[[pattern]]
intent = "volume"
re = '^(?:(?:set|turn|change|put) )?(?:the |my )?(?:(?P<ring>ring volume|ringer volume|ringtone volume)|media volume|music volume|volume)(?: (?:to|at))? (?P<level>.+?)$'

[[pattern]]
intent = "volume"
re = '^(?:(?:make|turn) )?(?:it |the music |the sound )?(?:(?:a bit|a little|slightly) )?(?P<dir>louder|quieter|softer)$'

[[pattern]]
intent = "volume"
re = '^turn (?:it |the volume |the music )?(?P<dir>up|down)$'

[[pattern]]
intent = "brightness"
re = '^(?:(?:set|turn|change|put) )?(?:the )?(?:screen brightness|display brightness|brightness)(?: (?:to|at))? (?P<level>.+?)$'

[[pattern]]
intent = "brightness"
re = '^(?:make )?(?:it |the screen |the display )?(?:(?:a bit|a little|slightly) )?(?P<dir>brighter|dimmer|darker)$'

[[pattern]]
intent = "dnd"
re = '^(?:(?:turn|switch|activate|enable|put) )?(?:on )?(?:do not disturb|dnd)(?: mode)?(?: (?P<off>off)| on)?$'

[[pattern]]
intent = "dnd"
re = '^(?:(?:turn|switch) off|(?P<off>disable|deactivate|end)) (?:do not disturb|dnd)(?: mode)?$'

[[pattern]]
intent = "sound_mode"
re = '^(?:(?:set|put|switch|turn) )?(?:the phone |my phone )?(?:to |on )?(?P<mode>silent|vibrate|vibration|ring|ringer)(?: mode)?(?: on)?$'

[[pattern]]
intent = "playing"
re = '^(?:what(?: is|s) (?:playing|this song|that song)(?: right now| now)?|which song is (?:this|that|playing)|what song is (?:this|that|playing))$'

[[pattern]]
intent = "notifications"
re = '^(?:(?:read|show) )?(?:me )?(?:my |the |new |all )?(?:notifications|messages)(?: from (?P<app>.+?))?$'

[[pattern]]
intent = "reply"
re = '^(?:reply|answer|respond) to (?P<app>.+?) (?:with|saying) (?P<message>.+)$'

[[pattern]]
intent = "web_search"
re = '^search the (?:web|internet) for (?P<query>.+)$|^(?:search|look up|google) (?:for )?(?P<query2>.+?) (?:on|in) the (?:web|internet)$'

[expressions]
message = '(?i)^.*?\b(?:with|saying)\s+(?P<m>.+)$'
query = '(?i)^(?:search|look up|google)(?: the (?:web|internet))?(?: for)?\s+(?P<m>.+?)(?:\s+(?:on|in) the (?:web|internet))?[.!?]*$'

[words]
up = ["louder", "brighter", "up", "higher", "more"]
down = ["quieter", "softer", "dimmer", "darker", "down", "lower", "less"]
max = ["maximum", "max", "full"]
min = ["minimum", "min", "zero", "mute", "off"]
auto = ["automatic", "auto", "adaptive"]
percent = ["percent", "per cent"]
silent = ["silent"]
vibrate = ["vibrate", "vibration"]

