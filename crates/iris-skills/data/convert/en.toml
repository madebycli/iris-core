[[pattern]]
intent = "convert"
re = '^(?:(?:convert|how much is|how many is|what is|whats) )?(?P<value>(?:minus |negative )?\S+) (?P<from>\S+(?: \S+){0,2}?) (?:in|to|into) (?P<to>\S+(?: \S+){0,2}?)$'

[words]
degree = ["degrees", "degree"]
minus = ["minus", "negative"]

[messages]
result = "{value} {from} is {result} {to}."
incompatible = "I cannot convert between those units."
decimal = "."

