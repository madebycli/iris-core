[[pattern]]
intent = "convert"
re = '^(?:(?:rechne|wie viel sind|wie viel ist|wieviel sind|wieviel ist|was sind|was ist|konvertier\w*|umrechn\w*) )?(?P<value>(?:minus )?\S+) (?P<from>\S+(?: \S+){0,2}?) (?:in|zu|nach|ins) (?P<to>\S+(?: \S+){0,2}?)(?: (?:um|umrechnen|sind|ist|um rechnen))?$'

[words]
degree = ["grad"]
minus = ["minus"]

[messages]
result = "{value} {from} sind {result} {to}."
incompatible = "Diese Einheiten kann ich nicht ineinander umrechnen."
decimal = ","

