[[pattern]]
intent = "delete"
re = '\b(?:lösch\w*|entfern\w*|streich\w*)\b.*\berinnerung(?:en)?\b'

[[pattern]]
intent = "list"
re = '\b(?:welche|was für|zeig\w*|nenn\w*|habe ich|hab ich|gibt es|meine|wie viele)\b.*\berinnerung(?:en)?\b|\bnächste erinnerung\b|\bworan\b.*\berinner\w*\b'

[[pattern]]
intent = "create"
re = '\berinner\w*\b|^vergiss nicht\b|\b(?:erstell\w*|leg\w*|mach\w*|neue|stell\w*)\b.*\baufgabe\b|\bsag\w* mir\b.*\bbescheid\b|\bbescheid\b.*\bsag\w*\b'

[expressions]
# "auf meine Arbeitsliste", "in die Liste Arbeit": the list of the task app a reminder should go to
list_hint = '\b(?:auf|in|zu|zur) (?:meine[rn]? |die |der |den )?(?:(?P<a>\p{L}+?)s?liste|liste (?P<b>\p{L}+))\b'

# German puts "zu" inside a separable verb: "rauszubringen" is the task "rausbringen"
[[rewrite]]
re = '(?i)\b(raus|rein|ein|auf|ab|an|aus|mit|vor|weg|zurück|hin|her|um|nach|durch|weiter|los|fest|hoch|runter|rüber|vorbei)zu(\p{L}{3,}n)\b'
to = '${1}${2}'

[words]
# removed wherever they stand
drop = ["erinnert werden", "erinnert", "vergiss nicht", "erinnere mich", "erinner mich", "erinnere", "erinner", "erinnern", "erinnerung", "erinnerungen", "sag mir bescheid", "sagst du mir bescheid", "bescheid sagen", "bescheid", "aufgabe"]
# removed from the front of the title, again and again
lead = ["kannst du", "könntest du", "würdest du", "ich möchte", "ich will", "ich muss", "erstelle", "erstell", "stelle", "stell", "lege", "leg", "mache", "mach", "mir", "mich", "eine", "einen", "ein", "neue", "für", "an", "ans", "am", "daran", "dran", "dass ich", "dass", "den", "die", "das", "dem", "zum", "zur", "zu", "und", "oder", "ja", "noch", "dich", "an"]
# removed from the end of the title
trail = ["muss", "soll", "möchte", "will", "müssen", "sollen", "an", "ein", "und", "dran", "daran", "denken"]
all = ["alle", "alles", "sämtliche"]
next = ["nächste", "nächstes", "als nächstes"]

