[[pattern]]
intent = "today"
re = '\bwhat\b.*\b(?:do i have to do|should i do|is on|is planned)\b.*\btoday\b|\bwhat\b.*\btoday\b.*\b(?:to do|on)\b'

[[pattern]]
intent = "move"
re = '\b(?:move|postpone|reschedule|push)\b.*\breminder\b'

[[pattern]]
intent = "snooze"
re = '\bsnooze\b|\bremind me (?:again|later)\b|\bagain\b.*\bremind\w*\b|\bremind\w*\b.*\bagain\b'

[[pattern]]
intent = "delete"
re = '\b(?:delete|remove|cancel|clear)\b.*\breminders?\b'

[[pattern]]
intent = "list"
re = '\b(?:what|which|show|list|any|do i have|how many|my)\b.*\breminders?\b|\bnext reminder\b'

[[pattern]]
intent = "create"
re = '\bremind\w*\b|\b(?:set|create|add|make|schedule)\b.*\breminder\b|\blet me know\b'

[expressions]
list_hint = '\b(?:to|on|in) (?:my |the )?(?P<a>\p{L}+) list\b'

[words]
drop = ["again", "later", "snooze", "remind me", "reminder", "remind", "let me know"]
lead = ["can you", "could you", "would you", "please", "i need to", "i have to", "i want to", "i would like", "set", "create", "add", "make", "schedule", "me", "a", "an", "the", "new", "for", "to", "about", "that i need to", "that i have to", "that i", "that", "of", "and"]
trail = ["and", "to"]
all = ["all", "every", "everything"]
next = ["next"]

