[[pattern]]
intent = "remove"
re = '\b(?:lösch\w*|entfern\w*|streich\w*)\b.*\bnotiz(?:en)?\b'

[[pattern]]
intent = "read"
re = '\bwas (?:steht|habe ich|hab ich|ist)\b.*\bnotiz|\bwas (?:ich )?(?:habe )?(?:ich )?mir notiert\b|\bnotiert habe\b|\b\b(?:zeig\w*|lies|lese|sehen|welche|was habe ich|was hab ich)\b.*\bnotiz(?:en)?\b|\bnotiz(?:en)?\b.*\b(?:sehen|vor|anzeigen)$|\bwas ich notiert habe\b|\bwas (?:habe|hab) ich (?:mir )?(?:alles |denn |so )?notiert\b|\bwas (?:steht|ist) (?:alles |denn )?in meinen notizen\b'

[[pattern]]
intent = "add"
re = '\bnotier\w*\b|\bnotiz(?:en)?\b|^schreib\w* (?:das )?auf\b'

