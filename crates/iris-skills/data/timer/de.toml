[[pattern]]
intent = "pause"
re = '\b(?:pausier\w*|unterbrech\w*|anhalt\w*|halte|pause)\b.*\b\w*timer\b(?: an| kurz an)?$|^(?:den |meinen )?\w*timer (?:pausieren|anhalten|unterbrechen)$'

[[pattern]]
intent = "resume"
re = '\b(?:setz\w*|lass\w*|mach\w*)\b.*\b\w*timer\b.*\b(?:fort|weiter\w*)$|^(?:den |meinen )?\w*timer (?:fortsetzen|weiter|weiterlaufen lassen|weitermachen|weiterlaufen)$|\bfortsetz\w*\b.*\b\w*timer\b'

[[pattern]]
intent = "extend"
re = '\bverlänger\w*\b.*\b\w*timer\b|\b\w*timer\b.*\b(?:verlängern|länger)\b|\b(?:gib|pack)\w*\b.*\bauf (?:den |meinen )?\w*timer\b'

[[pattern]]
intent = "restart"
re = '\b(?:start\w*|setz\w*)\b.*\b\w*timer\b.*\b(?:neu|zurück|von vorn\w*|nochmal|noch einmal)$|^(?:den |meinen )?\w*timer (?:neu starten|neustarten|zurücksetzen)$'

[[pattern]]
intent = "cancel"
re = '\b(?:beend\w*|stopp\w*|lösch\w*|brich|entfern\w*|abbrechen)\b.*\b\w*timer\b|\b\w*timer\b.*\b(?:beenden|stoppen|löschen|abbrechen|aus|weg|ab)$'

[[pattern]]
intent = "query"
re = '\b(?:wie lange|wie viel zeit|wann|welche|laufen|läuft|zeig\w*|aktive\w*|laufende\w*|gibt es)\b.*\b\w*timer\b|\b\w*timer\b.*\b(?:noch|übrig)\b'

[[pattern]]
intent = "set"
re = '\b(?:\w*timer|zeitgeber|countdown)\b'

[words]
# taken out of what is left after the duration; the rest is the timer's name
noise = ["bis", "um", "alt", "schalt", "schalte", "schalten", "ein", "an", "aus", "timer", "zeitgeber", "countdown", "stell", "stelle", "stellen", "setz", "setze", "mach", "mache", "starte", "start", "erstelle", "mir", "einen", "ein", "eine", "nen", "neuen", "auf", "für", "von", "mit", "den", "der", "die", "das", "namens", "und", "an", "ich", "brauche", "kannst", "du"]
name_suffix = ["timer"]
no_name = ["nein", "nichts", "kein name", "keinen", "egal", "ohne", "ohne name", "ohne namen", "weiter"]
all = ["alle", "alles", "sämtliche", "beide"]

[messages]
