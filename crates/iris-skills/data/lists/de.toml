[[pattern]]
intent = "buy"
re = '^ich muss (?P<rest>.+) kaufen$'

[[pattern]]
intent = "check_all"
re = '\bha[ck]\w*\b.*\b(?:alles|alle)\b.*\bab$|\balles?\b.*\babhaken$'

[[pattern]]
intent = "check_all"
re = '^ha[ck]\w* (?:die |meine |den |alles auf (?:der|meiner) )?\p{L}*(?:liste|zettel)(?: \p{L}+)? ab$'

[[pattern]]
intent = "clear"
re = '^(?:lösch\w*|leer\w*|entfern\w*|räum\w*) (?:die |meine |den |alles auf (?:der|meiner) )?\p{L}*(?:liste|zettel)(?: \p{L}+)?$|^alles (?:von|auf|aus) (?:der|meiner|meinen) \p{L}*(?:liste|zettel) (?:löschen|entfernen|leeren)$'

[[pattern]]
intent = "read_all"
re = '\b(?:meine|alle|welche) listen\b|\bzeig\w* (?:mir )?(?:meine )?listen\b'

[[pattern]]
intent = "clear"
re = '\b(?:lösch\w*|leer\w*|entfern\w*|räum\w*)\b.*\b(?:alles|alle|komplett)\b|\bleer\w*\b.*\b\p{L}*liste\b'

[[pattern]]
intent = "check"
re = '\bha[ck]\w*\b.*\bab$|\babhaken$|\bist erledigt$|\bsind erledigt$'

[[pattern]]
intent = "remove"
re = '\b(?:lösch\w*|streich\w*|entfern\w*)\b|\bnimm\b.*\b(?:von|aus|runter|weg)\b'

[[pattern]]
intent = "read"
re = '\bwas (?:steht|ist|habe ich|hab ich|muss ich)\b.*\b(?:\p{L}*liste|\p{L}*zettel|einkaufen)\b|\b(?:zeig\w*|lies|gib|sag)\b.*\b\p{L}*liste\b|^(?:meine |die )?\p{L}*liste$|\bhabe ich\b.*\bauf\b.*\bliste\b'

[[pattern]]
intent = "guided"
re = '\b(?:neuen?|erstell\w*)\b.*\beintrag\b'

[[pattern]]
intent = "add"
re = '\b\p{L}*(?:liste|zettel)\b'

[[pattern]]
intent = "more"
re = '^(?:ja )?(?:und noch|und|noch|dazu|außerdem) (?P<rest>.+)$'

[expressions]
# a target without the word "list", for sentences the network routed ("auf meinen Einkaufskram")
target = '\b(?:auf|zu|in) (?:meine[nrm]?|die|der|den|dem|unsere[nrm]?) \p{L}+$'
# the list a sentence names: "Einkaufsliste", "Einkaufszettel", "Liste Spiele"
list_name = '\bliste (?P<b>\p{L}+)\b|\b(?P<a>\p{L}+?)s?(?:liste|zettel)\b'
# the whole phrase that names it, to take it out of the entry
list_phrase = '\b(?:(?:auf|zu|zur|in|von|aus|an) )?(?:(?:meine[rnm]?|die|der|den|dem|unsere[rnm]?) )?(?:liste \p{L}+|\p{L}*liste|\p{L}*zettel)\b'

