[[pattern]]
intent = "buy"
re = '^i need to buy (?P<rest>.+)$'

[[pattern]]
intent = "check_all"
re = '\b(?:check|tick|cross)\b.*\b(?:everything|all)\b.*\boff\b'

[[pattern]]
intent = "read_all"
re = '\b(?:my|all|which) lists\b|\bshow\w* (?:me )?(?:my )?lists\b'

[[pattern]]
intent = "clear"
re = '\b(?:delete|clear|remove|empty)\b.*\b(?:everything|all)\b|\b(?:clear|empty)\b.*\blist\b'

[[pattern]]
intent = "check"
re = '\b(?:check|tick|cross)\b.*\boff\b|\bis done$|\bare done$'

[[pattern]]
intent = "remove"
re = '\b(?:delete|remove|take)\b'

[[pattern]]
intent = "read"
re = '\bwhat (?:is|do i have|have i got)\b.*\blist\b|\b(?:show|read|tell)\b.*\blist\b'

[[pattern]]
intent = "peek"
re = '^(?:my |the )?\p{L}+ list$'

[[pattern]]
intent = "guided"
re = '\b(?:new|create|add)\b.*\b(?:entry|item)\b'

[[pattern]]
intent = "put"
re = '^(?:add|put|write)\b.*\b(?:to|on) (?:the |my |our )?\p{L}* list\b'

[[pattern]]
intent = "add"
re = '\blist\b|^i need to buy (?P<rest>.+)$'

[[pattern]]
intent = "more"
re = '^(?:yes )?(?:and also|and|also|plus) (?P<rest>.+)$'

[expressions]
# a target without the word "list", for sentences the network routed ("auf meinen Einkaufskram")
target = '\b(?:to|on|onto|in) (?:my|the|our) \p{L}+$'
list_name = '\b(?P<a>\p{L}+) list\b'
list_phrase = '\b(?:(?:to|on|onto|from|off|in) )?(?:(?:my|the|our) )?\p{L}+ list\b'

[tables.list_alias]
shopping = "Shopping"
grocery = "Shopping"
groceries = "Shopping"

[tables.defaults]
list = "Shopping"

[words]
school = ["homework"]
