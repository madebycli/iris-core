[[pattern]]
intent = "delete"
re = '^(?:lösch\w*|entfern\w*|streich\w*) (?:den |meinen |die |meine |alle )?(?:nächsten )?wecker\b|^(?:den |meinen )?wecker\b.*\b(?:löschen|entfernen)$'

[[pattern]]
intent = "dismiss"
re = '^(?:verwirf|beende|stopp\w*|stop|deaktivier\w*|überspring\w*) (?:den |meinen )?(?:nächsten )?wecker(?: (?:aus|ab|weg))?$|^(?:schalt\w*|mach\w*|stell\w*) (?:den |meinen )?(?:nächsten )?wecker (?:aus|ab|weg)$|^(?:den )?(?:nächsten )?wecker (?:verwerfen|ausschalten|abschalten|überspringen|beenden|ausmachen|abstellen|deaktivieren)$'

[[pattern]]
intent = "next"
re = '\bwann\b.*\b(?:nächste[rn]?|klingelt|weckt)\b.*\bwecker\b|\bnächste[rn]? wecker\b|\bwann (?:werde ich|wirst du mich) geweckt\b|\bwie lange noch bis zum wecker\b'

[[pattern]]
intent = "list"
re = '\b(?:welche|zeig\w*|liste|alle)\b.*\bwecker\b|\bwecker(?:liste)?\b.*\b(?:zeigen|anzeigen)\b'

[[pattern]]
intent = "set"
re = '\b(?:stell\w*|setz\w*|erstell\w*|mach\w*|richte\w*|programmier\w*|neue[nr]?)\b.*\bwecker\b|\bweck\w* mich\b|\bwecker (?:für|auf|um|in|morgen|heute)\b|^wecker$'

[messages]
set = "Der Wecker steht auf {when}."
