dismiss_ask_at = "Einen bestimmten Wecker kann ich nicht löschen. Soll ich die Uhr-App bitten, den Wecker um {time} auszuschalten?"
dismissed_at = "Ich habe die Uhr-App gebeten, diesen Wecker auszuschalten. Prüfe es bitte dort; ganz löschen kannst du ihn nur in der Uhr-App."
