[package]
name = "iris-nlu"
description = "What Iris reads from a sentence once the network has named the function: dates, times, durations, places, names; the fallback plan and the readings it offers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The patterns came from the app and use lookaround, which the regex crate does not have.
fancy-regex = "0.20"
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
flate2 = "1"
