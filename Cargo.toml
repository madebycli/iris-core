[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
jiff = { version = "0.2", features = ["serde"] }
iris-core = { path = "crates/iris-core" }
iris-skills = { path = "crates/iris-skills" }

# dependencies are built optimised in debug builds too: the specs compile many patterns
[profile.dev.package."*"]
opt-level = 2
