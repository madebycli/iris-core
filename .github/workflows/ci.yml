name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # The network loads ONNX Runtime at run time (as on Android): the same version the app ships, checked by hash.
      - name: ONNX Runtime 1.28.0 for the network parity test
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/ort.tgz" https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
          echo "a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407  $RUNNER_TEMP/ort.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime-linux-x64-1.28.0/lib" >> "$GITHUB_ENV"
      - name: Tests (specs, pipeline, store, network parity skipped without model files)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
