args = [{ name = "list", kind = "text", required = true, max = 80 }]

[[action]]
id = "list.check_common"
exec = "skill:lists"
args = [{ name = "list", kind = "text", required = true, max = 80 }, { name = "other", kind = "text", required = true, max = 80 }]

[[action]]
id = "note.add"
exec = "skill:notes"
args = [{ name = "text", kind = "text", required = true, max = 200 }]

[[action]]
id = "note.show"
exec = "skill:notes"
args = []

[[action]]
id = "note.remove"
exec = "skill:notes"
args = [{ name = "text", kind = "text", required = true, max = 200 }]

[[action]]
id = "device.volume"
exec = "skill:device"
need = ["device"]
args = [{ name = "change", kind = "enum", required = true, values = ["up", "down", "set"] }, { name = "percent", kind = "int", min = 0, max = 100 }, { name = "ring", kind = "bool" }]

[[action]]
