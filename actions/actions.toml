need = ["tasks"]
args = [{ name = "title", kind = "text", required = true, max = 80 }, { name = "date", kind = "date" }]

[[action]]
id = "calendar.event"
exec = "skill:reminder"
need = ["calendar"]
confirm = true
moment = ["date", "time", false]
args = [{ name = "title", kind = "text", required = true, max = 80 }, { name = "date", kind = "date", required = true }, { name = "time", kind = "time", required = true }, { name = "minutes", kind = "int", min = 5, max = 1440 }]

[[action]]
id = "flashlight.set"
