moment = ["date", "time", false]
args = [{ name = "title", kind = "text", required = true, max = 80 }, { name = "date", kind = "date", required = true }, { name = "time", kind = "time", required = true }]

[[action]]
id = "list.add"
exec = "skill:lists"
args = [{ name = "list", kind = "text", required = true, max = 80 }, { name = "items", kind = "texts", required = true, max = 80, count = 20 }]

[[action]]
id = "list.show"
