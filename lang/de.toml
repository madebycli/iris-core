quarter_past = ["viertel nach"]
quarter_to = ["viertel vor"]
past = ["nach"]
to = ["vor"]
am = []
pm = []
date_fillers = ["am", "den", "dem", "vom"]
date_joiners = []
next_words = ["nächsten", "nächste", "nächster", "kommenden", "kommende"]
every_words = ["jeden", "jede", "jedes"]
[time.units]
second = ["sekunde", "sekunden", "sek"]
minute = ["minute", "minuten", "min"]
hour = ["stunde", "stunden", "std"]
day = ["tag", "tage", "tagen"]
week = ["woche", "wochen"]
[time.fractions]
"halbe stunde" = 1800
"halben stunde" = 1800
"viertelstunde" = 900
"viertel stunde" = 900
"dreiviertelstunde" = 2700
"dreiviertel stunde" = 2700
"anderthalb stunden" = 5400
"eineinhalb stunden" = 5400
"zweieinhalb stunden" = 9000
[time.day_offsets]
heute = 0
morgen = 1
"übermorgen" = 2
[time.period_after_day]
morgen = "morning"        # "heute morgen" is this morning, not tomorrow
[time.weekdays]
montag = 1
dienstag = 2
mittwoch = 3
donnerstag = 4
freitag = 5
samstag = 6
sonnabend = 6
sonntag = 7
[time.months]
januar = 1
februar = 2
"märz" = 3
april = 4
mai = 5
juni = 6
juli = 7
august = 8
september = 9
oktober = 10
november = 11
dezember = 12
[time.named]
mittag = "12:00"
mittags = "12:00"
mitternacht = "00:00"
[time.periods]
morning = ["morgens", "früh", "vormittags", "am morgen", "am vormittag"]
afternoon = ["nachmittags", "am nachmittag", "nachmittag"]
evening = ["abends", "am abend", "abend"]
night = ["nachts", "in der nacht", "nacht"]
[time.repeat]
daily = ["täglich", "jeden tag"]
weekdays = ["werktags", "an werktagen", "unter der woche"]
weekly = ["wöchentlich", "jede woche"]

[dialog]
fillers = ["bitte", "mal", "ähm", "äh", "hm", "doch", "eben", "halt", "iris", "hey", "hallo", "hi"]
cancel = ["abbrechen", "abbruch", "stopp", "stop", "halt", "vergiss es", "vergiss das", "lass das", "lass mal", "lass es", "lass gut sein", "schon gut", "egal", "nein danke", "doch nicht", "brich ab", "das reicht", "reicht", "genug", "cancel", "never mind", "nevermind"]
soft = ["ach", "nein", "nee", "nö", "ne", "ok", "okay", "also", "dann", "bitte", "jetzt", "na", "ja"]
say_again = ["sag das nochmal", "sag das noch mal", "sag es nochmal", "wie bitte", "was hast du gesagt", "noch mal bitte", "nochmal bitte"]
repeat = ["wiederhole das", "wiederhole es", "mach das nochmal", "mach das noch mal", "noch einmal", "nochmal", "das gleiche nochmal"]
undo = ["rückgängig", "mach das rückgängig", "mach es rückgängig", "mach rückgängig", "das rückgängig machen", "nimm das zurück", "nimm es zurück", "widerrufe das", "zurücknehmen"]
yes = ["ja", "jo", "jep", "klar", "genau", "mach das", "ja bitte", "okay", "ok", "richtig", "stimmt"]
no = ["nein", "nö", "ne", "nicht", "lieber nicht", "falsch"]
done = ["nein", "nö", "das war's", "das wars", "das war alles", "reicht", "das reicht", "fertig", "nichts mehr", "nichts", "danke", "nein danke", "passt"]
joiners = ["und"]

# what the speech recogniser makes of common words
[[repair]]
re = '^(\p{L}*?)(?:less|lisste|lieste|lyste|liester|lise)$'
to = '${1}liste'

[[repair]]
re = '^(?:hüge|huge|fuge|hüte)$'
to = 'füge'

[[normalize]]
# the list's name said as two words: "Einkaufs Liste"
re = '(?i)\b(einkaufs|spiele|spiel|arbeits|wunsch|pack|kleidungs|kleidung|haushalts|geschenk|geschenke|schul|todo|to do) (liste|zettel)\b'
to = '${1}${2}'

[[repair]]
re = '^(?:fuege|fuge|füge|fuegen)$'
to = 'füge'

[[repair]]
re = '^setzt$'
to = 'setze'

[format]
clock = "{h}:{mm} Uhr"
date = "{d}.{m}."
weekday_names = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"]
month_names = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"]
list_and = "und"

[messages]
