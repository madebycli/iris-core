# German language pack of the Iris core. Everything the engine knows about German lives here.
code = "de"

[numbers]
joiner = "und"            # einundzwanzig = ein + und + zwanzig
[numbers.words]
null = 0
ein = 1
eins = 1
eine = 1
einen = 1
einer = 1
einem = 1
zwei = 2
zwo = 2
drei = 3
vier = 4
"fünf" = 5
sechs = 6
sieben = 7
acht = 8
neun = 9
zehn = 10
elf = 11
"zwölf" = 12
dreizehn = 13
vierzehn = 14
"fünfzehn" = 15
sechzehn = 16
siebzehn = 17
achtzehn = 18
neunzehn = 19
hundert = 100
[numbers.tens]
zwanzig = 20
"dreißig" = 30
dreissig = 30
vierzig = 40
"fünfzig" = 50
sechzig = 60
siebzig = 70
achtzig = 80
neunzig = 90

[time]
