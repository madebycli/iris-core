# English words of the action planner. See de.toml.
code = "en"

[routing]
reference = '(?iu)\b(why|what did i (?:say|mean|want)|how come|explain)\b'
sequence = '(?iu)\b(and then|after that|then also|also|as well as|next)\b'
command = '(?iu)\b(create|remind\w*|set|add|delete|change|move|call|open|note|alarm|timer|reminder|list|appointment|task)\b'
question = '(?iu)^\s*(who|what|when|where|how|why|which)\b|\?\s*$'
simple = [
  '(?iu)^\W*(?:set|start)\s+(?:a\s+)?timer\s+(?:for|to)\s+\d+\s*\w*\W*$',
  '(?iu)\b(what time|what day|what date)\b',
  '(?iu)\b(volume|brightness|flashlight|do not disturb)\b',
  '(?iu)^\W*(?:stop|cancel|undo|yes|no|thanks|hello|hi)\W*$',
  '(?iu)^\W*show\b.{0,30}\b(?:reminders|timers|alarms|lists|notes)\W*$',
]

[format]
date = "%B %-d"
weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]

[render]
reminder = "Remind me {when} about {title}"
when_today = "at {time}"
when_tomorrow = "tomorrow at {time}"
when_date = "on {date} at {time}"
alarm = "Set an alarm for {time}{when}"
alarm_today = ""
alarm_tomorrow = " tomorrow"
alarm_date = " on {date}"
timer = "Set a timer{label} for {amount}"
timer_label = " called {label}"
seconds = "{n} seconds"
minutes = "{n} minutes"
hours = "{n} hours"
list = "Add {item} to the {list} list"
note = "Note {text}"

[ask]
time = "At what time?"
date = "For which day?"
duration = "For how long?"
title = "What should it be called?"
list = "Which list?"

[prompt]
system = """You plan actions for the voice assistant Iris. Today is {weekday}, {today} (time zone {zone}), it is {time}.
Answer with one JSON object only, no text before or after it. Three forms:
{"version":1,"actions":[ ... ]}   actions to carry out
{"version":1,"ask":{"slot":"time"}}   exactly one question, then no actions (slot: time, date, duration, title, list)
{"version":1,"not_action":true}   the message is no task for these actions
Actions (all fields required unless marked optional):
{"type":"reminder.create","title":"Shoe store","date":"2026-11-19","time":"16:00"}
{"type":"alarm.set","time":"15:40","date":"2026-11-19"}   date optional
{"type":"timer.set","seconds":600,"label":"Pasta"}   label optional
{"type":"list.add","list":"Shopping","item":"Milk"}
{"type":"note.add","text":"Buy milk"}
Rules: At most 5 actions. date is YYYY-MM-DD, time is HH:MM in 24 hours. Turn relative words (tomorrow, the day after, in two hours) into fixed values. Clock time, date and duration are separate values: a duration appears only in timer.set seconds. If the user gives an arrival time and a travel or lead time, work out the alarm time yourself. Titles are short noun phrases without a verb and without punctuation, at most 80 characters. If something important is missing, ask instead of guessing. If the message is a question, a chat, a programming or writing task or a request to you yourself, answer with not_action. Invent nothing."""
