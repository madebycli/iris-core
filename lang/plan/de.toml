# German words of the action planner: who handles a sentence (the AI-use levels), the sentences the core
# says to itself for a validated action, the questions it asks, and what the assistant AI is told.
code = "de"

[routing]
# a question about what was said or done before
reference = '(?iu)\b(warum|wieso|weshalb|weswegen|wann wollte ich|was (?:habe|hab) ich (?:gesagt|gemeint|gewollt)|was meinst du|wie kommt es|erkl[äa]r\w*)\b'
# several tasks in one sentence
sequence = '(?iu)\b(und danach|und dann|danach|dann noch|au[ßs]erdem|und au[ßs]erdem|als n[äa]chstes|und noch)\b'
# a request, also when it is put as a question ("kannst du eine Erinnerung erstellen?")
command = '(?iu)\b(erstell\w*|erinner\w*|stell\w*|l[öo]sch\w*|f[üu]g\w*|trag\w*|schreib\w*|speicher\w*|ruf\w*|[öo]ffne\w*|setz\w*|[äa]nder\w*|verschieb\w*|wecker|timer|erinnerung|notiz|liste|termin|aufgabe)\b'
question = '(?iu)^\s*(wer|was|wann|wo|wie|warum|wieso|weshalb|welche[rsmn]?|wozu)\b|\?\s*$'
# clear, short commands the local brain does well
simple = [
  '(?iu)^\W*(?:stell\w*|start\w*|setz\w*|mach\w*)?\s*(?:mir\s+)?(?:einen\s+|den\s+)?timer\s+(?:auf|f[üu]r)\s+\d+\s*\w*\W*$',
  '(?iu)\b(wie sp[äa]t|wie viel uhr|welcher tag|welches datum)\b',
  '(?iu)\b(lauter|leiser|lautst[äa]rke|heller|dunkler|taschenlampe|licht (?:an|aus)|nicht st[öo]ren)\b',
  '(?iu)^\W*(?:stopp?|abbrechen|r[üu]ckg[äa]ngig|ja|nein|danke|hallo|hi)\W*$',
  '(?iu)^\W*zeig\w*\b.{0,30}\b(?:erinnerungen|timer|wecker|listen|notizen)\W*$',
]

[format]
weekdays = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"]


[ask]
time = "Um wie viel Uhr?"
date = "Für welchen Tag?"
duration = "Wie lange?"
title = "Wie soll es heißen?"
list = "Auf welche Liste?"

[prompt]
head = """Du planst Aktionen für den Sprachassistenten Iris. Heute ist {weekday}, der {today} (Zeitzone {zone}), es ist {time} Uhr.
Antworte nur mit einem JSON-Objekt, ohne Text davor oder danach. Drei Formen:
{"version":2,"actions":[ ... ]}   Aktionen, die ausgeführt werden
{"version":2,"ask":{"slot":"time"}}   genau eine Rückfrage, dann keine Aktionen (slot: time, date, duration, title, list)
{"version":2,"not_action":true}   die Nachricht ist keine Aufgabe für diese Aktionen"""
actions_title = "Aktionen (alle Felder Pflicht, außer wo \"optional\" steht):"
rules = """Regeln: Höchstens 6 Aktionen, nur die oben genannten. date ist JJJJ-MM-TT, time ist HH:MM in 24 Stunden, ein Termin liegt mindestens zwei Minuten in der Zukunft. Rechne relative Angaben (morgen, übermorgen, in zwei Stunden) in feste Werte um. Uhrzeit, Datum und Dauer sind getrennte Werte. Titel sind kurze Hauptwort-Gruppen ohne Verb und ohne Satzzeichen, höchstens 80 Zeichen. Fehlt etwas Wichtiges, stelle die Rückfrage, statt zu raten. Ist die Nachricht eine Frage, ein Gespräch, eine Programmier- oder Schreibaufgabe oder eine Bitte an dich selbst, antworte mit not_action. Erfinde nichts."""

[actions]
"timer.set" = '{"type":"timer.set","seconds":600,"label":"Nudeln"}   label optional. Eine Dauer steht nur hier, in seconds.'
"timer.cancel" = '{"type":"timer.cancel","label":"Nudeln"}   Timer abbrechen; label optional, bei "all":true alle. Nur bei ausdrücklichem Wunsch.'
"timer.pause" = '{"type":"timer.pause","label":"Nudeln"}   label optional.'
"timer.resume" = '{"type":"timer.resume","label":"Nudeln"}   label optional.'
"timer.extend" = '{"type":"timer.extend","seconds":120,"label":"Nudeln"}   Läuft weiter um seconds länger; label optional.'
"timer.show" = '{"type":"timer.show"}   zeigt, wie lange laufende Timer noch laufen; label optional.'
"alarm.set" = '{"type":"alarm.set","time":"15:40","date":"2026-11-19"}   date optional. Nennt der Nutzer eine Ankunftszeit und eine Weg- oder Vorlaufzeit, rechne die Weckzeit selbst aus.'
"alarm.next" = '{"type":"alarm.next"}   sagt, wann der nächste Wecker klingelt.'
"alarm.show" = '{"type":"alarm.show"}   öffnet die Weckerliste der Uhr-App.'
"alarm.dismiss" = '{"type":"alarm.dismiss","time":"07:00"}   time optional (sonst der nächste Wecker). Iris fragt vorher nach.'
"reminder.create" = '{"type":"reminder.create","title":"Schuhhaus Müller","date":"2026-11-19","time":"16:00"}'
"reminder.show" = '{"type":"reminder.show"}   zeigt die offenen Erinnerungen.'
"reminder.delete" = '{"type":"reminder.delete","title":"Zahnarzt"}   title: der Titel der vorhandenen Erinnerung.'
"reminder.move" = '{"type":"reminder.move","title":"Zahnarzt","date":"2026-11-20","time":"09:00"}   verschiebt eine vorhandene Erinnerung.'
"list.add" = '{"type":"list.add","list":"Einkauf","items":["Milch","Brot"]}   alle Einträge für eine Liste in EINER Aktion (bis 20); eine Liste je Aktion.'
"list.show" = '{"type":"list.show","list":"Einkauf"}   list optional.'
"list.check" = '{"type":"list.check","item":"Milch","list":"Einkauf"}   hakt einen Eintrag ab; list optional.'
"list.remove" = '{"type":"list.remove","item":"Milch","list":"Einkauf"}   löscht einen Eintrag; list optional.'
"list.check_all" = '{"type":"list.check_all","list":"Einkauf"}   hakt alles auf der Liste ab.'
"list.check_common" = '{"type":"list.check_common","list":"Essliste","other":"Einkauf"}   hakt auf list ab, was auch auf other steht. Iris prüft das selbst auf dem Telefon: du siehst die Listen nie, rate keine Einträge.'
"note.add" = '{"type":"note.add","text":"Milch kaufen"}'
"note.show" = '{"type":"note.show"}   liest die Notizen vor.'
"note.remove" = '{"type":"note.remove","text":"Milch"}   text: Teil der vorhandenen Notiz.'
"device.volume" = '{"type":"device.volume","change":"set","percent":40,"ring":false}   change: up, down, set (dann percent); ring true für den Klingelton, sonst Medien.'
"device.brightness" = '{"type":"device.brightness","change":"set","percent":60}   change: up, down, set (dann percent), auto.'
"device.sound_mode" = '{"type":"device.sound_mode","mode":"vibrate"}   mode: ring, vibrate, silent.'
"device.dnd" = '{"type":"device.dnd","on":true}   Bitte nicht stören an oder aus.'
"task.create" = '{"type":"task.create","title":"Steuer abgeben","date":"2026-11-30"}   Aufgabe in der Aufgaben-App; date optional.'
"calendar.event" = '{"type":"calendar.event","title":"Zahnarzt","date":"2026-11-19","time":"15:00","minutes":60}   Termin im Kalender; minutes optional. Iris fragt vor dem Eintragen nach.'
"flashlight.set" = '{"type":"flashlight.set","on":true}   Taschenlampe an oder aus.'

"reminder.snooze" = '{"type":"reminder.snooze","seconds":600}   dieselbe Erinnerung, die zuletzt klingelte, nach seconds nochmal (optional, Standard 10 Minuten).'
"clock.time" = '{"type":"clock.time"}   sagt die Uhrzeit.'
"clock.date" = '{"type":"clock.date"}   sagt das heutige Datum.'
"stopwatch.start" = '{"type":"stopwatch.start"}   startet die Stoppuhr.'
"stopwatch.stop" = '{"type":"stopwatch.stop"}   hält die Stoppuhr an.'
"stopwatch.reset" = '{"type":"stopwatch.reset"}   setzt die Stoppuhr zurück.'
"stopwatch.show" = '{"type":"stopwatch.show"}   sagt die Stoppuhrzeit.'
"convert.units" = '{"type":"convert.units","value":5,"from":"meilen","to":"kilometer"}   Einheiten als Wörter in der Sprache des Nutzers.'
"search.web" = '{"type":"search.web","query":"Rezept Kürbissuppe"}   öffnet eine Websuche im Browser; nur wenn der Nutzer suchen will, nicht für Wissensfragen.'
"music.playing" = '{"type":"music.playing"}   sagt, was gerade läuft.'
"notification.read" = '{"type":"notification.read","from":"WhatsApp"}   liest Benachrichtigungen vor; from optional (App oder Name).'
"notification.reply" = '{"type":"notification.reply","message":"Bin in zehn Minuten da","from":"Anna"}   antwortet auf eine Benachrichtigung; Iris fragt vor dem Senden nach.'
"music.control" = '{"type":"music.control","action":"play","query":"Queen"}   action: play, pause, next, previous; query nur bei play, optional.'
"app.open" = '{"type":"app.open","app":"Spotify"}   öffnet eine App.'
"navigation.start" = '{"type":"navigation.start","place":"Hauptbahnhof Köln"}   zeigt einen Ort in der Karten-App.'
"call.start" = '{"type":"call.start","contact":"Mama"}   ruft einen Kontakt an; bei mehreren Nummern fragt Iris nach.'
"weather.show" = '{"type":"weather.show","date":"2026-11-19","place":"Köln"}   Wetter; date und place optional (Standard heute, Standardort).'
"calendar.show" = '{"type":"calendar.show","date":"2026-11-19","days":1}   liest Kalendertermine vor; date optional (heute), days optional.'
"day.overview" = '{"type":"day.overview","tomorrow":false}   Tagesübersicht (Wetter, Termine); tomorrow optional.'
"battery.show" = '{"type":"battery.show"}   sagt den Akkustand.'
"calculator.compute" = '{"type":"calculator.compute","expression":"12 * (3 + 4)"}   rechnet; nur Ziffern und + - * / ^ ( ) . , %.'
"joke.tell" = '{"type":"joke.tell"}   erzählt einen Witz.'

[tools]
# which words of a request call for the tools of a family (several families may match: a mixed order gets all)
timer = '(?iu)\b(timer|stoppuhr|countdown|abbrech\w*|pausier\w*|verl[äa]nger\w*)\b'
alarm = '(?iu)\b(wecker|weck\w*|aufstehen|aufwachen|klingel\w*)\b'
reminder = '(?iu)\b(erinner\w*|bescheid|nicht vergessen|vergiss nicht|verschieb\w*|nochmal|schlummer\w*)\b'
list = '(?iu)\b(liste\w*|einkauf\w*|einkaufszettel|abhaken|abhak\w*|streich\w*)\b'
note = '(?iu)\b(notiz\w*|notier\w*|aufschreib\w*|schreib\w* auf|merk\w*)\b'
device = '(?iu)\b(lauter|leiser|lautst[äa]rke|heller|dunkler|helligkeit|stumm|vibrier\w*|lautlos|nicht st[öo]ren|klingelton)\b'
task = '(?iu)\b(aufgabe\w*|to-?do|todo|aufgabenliste)\b'
calendar = '(?iu)\b(kalender\w*|termin\w*)\b'
flashlight = '(?iu)\b(taschenlampe|lampe|blitz|licht)\b'
clock = '(?iu)\b(uhrzeit|wie sp[äa]t|datum|welcher tag|welches datum)\b'
stopwatch = '(?iu)\b(stoppuhr)\b'
convert = '(?iu)\b(umrechn\w*|in kilometer|in meilen|in celsius|in fahrenheit|wie viel\w* (?:sind|ist))\b'
search = '(?iu)\b(such\w*|google\w*|websuche|im internet)\b'
music = '(?iu)\b(musik|lied|song|spiel\w*|n[äa]chste[sr]? (?:lied|song)|pause|play|abspiel\w*|l[äa]uft gerade)\b'
notification = '(?iu)\b(benachrichtigung\w*|nachricht\w*|whatsapp|signal|telegram|antworte?\w*)\b'
app = '(?iu)\b([öo]ffne\w*|start\w*|app)\b'
navigation = '(?iu)\b(navig\w*|route|bring mich|wie komme ich|karte)\b'
call = '(?iu)\b(ruf\w*|anruf\w*|telefon\w*|anrufen)\b'
weather = '(?iu)\b(wetter|regen|regnet|temperatur|sonnig|schnee|jacke|regenschirm)\b'
day = '(?iu)\b(tages[üu]bersicht|[üu]bersicht|was steht heute an|was steht morgen an)\b'
battery = '(?iu)\b(akku|batterie|ladestand)\b'
calculator = '(?iu)\b(rechne\w*|berechne\w*|wie viel ist|mal|geteilt|plus|minus)\b'
joke = '(?iu)\b(witz\w*)\b'
